<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Live Translation App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Live Translation</h1>
      <p>实时翻译桌面应用</p>
    </header>
    <main>
      <div class="controls">
        <div class="language-settings">
          <label for="targetLanguage">目标语言:</label>
          <select id="targetLanguage">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
          </select>
        </div>
        <div class="recording-controls">
          <button id="startRecording" class="btn btn-primary">开始录音</button>
          <button id="stopRecording" class="btn btn-secondary" disabled>停止录音</button>
        </div>
      </div>
      <div class="content">
        <div class="subtitle-container">
          <h3>实时字幕</h3>
          <div id="originalText" class="text-box">
            <p>原始文本将显示在这里...</p>
          </div>
          <div id="translatedText" class="text-box">
            <p>翻译文本将显示在这里...</p>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
